name: Publish FracAttack Fractald

on:
  workflow_dispatch:
  push:
    branches:
      - fractal-29.x
    paths:
      - ".github/workflows/fracattack-fractald.yml"
      - ".dockerignore"
      - "contrib/fracattack/**"
      - "CMakeLists.txt"
      - "cmake/**"
      - "src/**"

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/willitmod/fracattack-fractald
  TAG: 0.3.0-dev

jobs:
  build:
    name: Build ${{ matrix.asset_arch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            platform: linux/amd64
            image_arch: amd64
            asset_arch: x86_64
          - runner: ubuntu-24.04-arm
            platform: linux/arm64
            image_arch: arm64
            asset_arch: aarch64

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set build metadata
        id: meta
        run: |
          set -euo pipefail
          echo "created=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_OUTPUT"
          echo "image=${IMAGE}:${TAG}-${{ matrix.image_arch }}" >> "$GITHUB_OUTPUT"
          echo "asset=fractald-willitmod-${TAG}-${{ matrix.asset_arch }}-linux-gnu" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Docker login (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build image
        run: |
          set -euo pipefail
          docker buildx build \
            --platform "${{ matrix.platform }}" \
            --load \
            --build-arg VCS_REF="${GITHUB_SHA}" \
            --build-arg BUILD_DATE="${{ steps.meta.outputs.created }}" \
            -f contrib/fracattack/Dockerfile \
            -t "${{ steps.meta.outputs.image }}" \
            .

      - name: Smoke test binaries
        run: |
          set -euo pipefail
          image="${{ steps.meta.outputs.image }}"
          docker run --rm "$image" bitcoind -version
          docker run --rm --entrypoint bitcoin-cli "$image" -version
          docker run --rm --entrypoint sh "$image" -lc '
            set -e
            datadir="$(mktemp -d)"
            bitcoind -regtest -datadir="$datadir" -server=1 -listen=0 -daemonwait
            bitcoin-cli -regtest -datadir="$datadir" getblockchaininfo
            bitcoin-cli -regtest -datadir="$datadir" stop
          '

      - name: Export tarball
        run: |
          set -euo pipefail
          image="${{ steps.meta.outputs.image }}"
          asset="${{ steps.meta.outputs.asset }}"
          mkdir -p "dist/${asset}/bin"
          cid="$(docker create "$image")"
          trap 'docker rm -f "$cid" >/dev/null 2>&1 || true' EXIT
          docker cp "$cid:/usr/local/bin/bitcoind" "dist/${asset}/bin/bitcoind"
          docker cp "$cid:/usr/local/bin/bitcoin-cli" "dist/${asset}/bin/bitcoin-cli"
          docker cp "$cid:/usr/local/bin/bitcoin-tx" "dist/${asset}/bin/bitcoin-tx"
          docker cp "$cid:/usr/local/bin/bitcoin-util" "dist/${asset}/bin/bitcoin-util"
          cp COPYING "dist/${asset}/COPYING"
          printf '%s\n' \
            "source=https://github.com/WillItMod/fractal" \
            "branch=${GITHUB_REF_NAME}" \
            "commit=${GITHUB_SHA}" \
            "image=${image}" \
            "platform=${{ matrix.platform }}" \
            > "dist/${asset}/BUILDINFO"
          tar -C dist -czf "${asset}.tar.gz" "$asset"

      - name: Upload tarball
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.meta.outputs.asset }}
          path: ${{ steps.meta.outputs.asset }}.tar.gz
          if-no-files-found: error

      - name: Push arch image
        run: docker push "${{ steps.meta.outputs.image }}"

  manifest:
    name: Publish multi-arch manifest
    runs-on: ubuntu-24.04
    needs: build
    steps:
      - name: Docker login (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish manifest
        run: |
          set -euo pipefail
          docker buildx imagetools create \
            -t "${IMAGE}:${TAG}" \
            "${IMAGE}:${TAG}-amd64" \
            "${IMAGE}:${TAG}-arm64"
          docker buildx imagetools inspect "${IMAGE}:${TAG}"

